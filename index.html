<script>
    document.getElementById('share-messenger').addEventListener('click', async function(e) {
        e.preventDefault();
        const shareUrl = 'https://shiequinn.com';
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
            window.location.href = `fb-messenger://share/?link=${encodeURIComponent(shareUrl)}`;
        }else if (navigator.share) {
                await navigator.share({
                    title: 'Ana marie Ranoco Portfolio',
                    url: shareUrl
                });
            } else {
                await navigator.clipboard.writeText(shareUrl);
                alert('Link copied! paste it into Messenger to share. ');
                window.open('https://messenger.com' , '_blank' ,'noopener');
        }
    });


</script>
